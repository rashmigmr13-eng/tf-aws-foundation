framework: [terraform]
directory: [stack, modules, bootstrap]
quiet: true
# Every skip is a deliberate, documented trade-off. Review before adding more.
skip-check:
  - CKV_AWS_150  # ALB deletion protection: on in prod only (var.protect)
  - CKV_AWS_157  # RDS Multi-AZ: dev/stage single-AZ for cost
  - CKV2_AWS_28  # WAF on ALB: phase 2 for prod
  - CKV_AWS_338  # 1-year log retention: 30d chosen for cost
  - CKV_AWS_18   # S3 access logging on state bucket
  - CKV_AWS_144  # cross-region replication on state bucket
  - CKV_AWS_145  # SSE-KMS (using SSE-S3)
  - CKV_AWS_119  # DynamoDB CMK
  - CKV_AWS_88   # public IP on app instances: ONLY in free-tier mode (enable_nat=false); SG allows ALB only
