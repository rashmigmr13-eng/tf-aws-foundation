name: nightly-destroy
# FinOps guard: tear down everything billable every night (23:00 IST). Re-create in ~10-15 min with env-up.
on:
  schedule: [{ cron: "30 17 * * *" }]
  workflow_dispatch:
permissions: { id-token: write, contents: read }
jobs:
  destroy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { env: [dev, stage, prod-lite] }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-arn: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ap-south-1
      - run: terraform -chdir=stack init -backend-config=../envs/${{ matrix.env }}.backend.hcl
      - run: terraform -chdir=stack destroy -auto-approve -var-file=../envs/${{ matrix.env }}.tfvars
