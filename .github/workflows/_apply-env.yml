name: apply-env
on:
  workflow_call:
    inputs: { env: { required: true, type: string } }
permissions: { id-token: write, contents: read }
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-arn: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ap-south-1
      - run: terraform -chdir=stack init -backend-config=../envs/${{ inputs.env }}.backend.hcl
      - run: terraform -chdir=stack apply -auto-approve -var-file=../envs/${{ inputs.env }}.tfvars -lock-timeout=300s
